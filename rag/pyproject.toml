[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragaudit"
version = "0.1.0"
description = "Conversational question answering over cybersecurity audit reports, air-gapped."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "numpy>=1.26,<3",
    "requests>=2.31,<3",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
]

[project.optional-dependencies]
# Retrieval models. Air-gapped installs stage weights separately; see docs/D04.
models = [
    "sentence-transformers>=3.0,<6",
    "transformers>=4.45,<6",
    "torch>=2.2,<4",
]
# Approximate-nearest-neighbour backend. Without it the numpy backend is used,
# which is exact but linear; see docs/D05 for the crossover measurement.
ann = ["faiss-cpu>=1.8,<2"]
parse = ["docling>=2.0,<3", "docling-core>=2.0,<3"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "ruff>=0.4,<1", "mypy>=1.9,<2"]

[project.scripts]
ragaudit = "ragaudit.cli:main"

[tool.setuptools.packages.find]
include = ["ragaudit*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
